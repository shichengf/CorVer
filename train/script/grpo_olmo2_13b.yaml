# OLMo-2-13B-Instruct: CorVer stepwise GRPO training config.
# Launch via main_stepwise_olmo.py (Unsloth FastModel Auto dispatch for OLMo-2);
# all other models use main_stepwise.py.
model_name_or_path: "allenai/OLMo-2-1124-13B-Instruct"
torch_dtype: bfloat16
lora_r: 128
lora_alpha: 256
attn_implementation: flash_attention_2
bf16: true
tf32: true
output_dir: "output/olmo2_13b"
run_name: "olmo2_13b"

dataset_id_or_path: ../data/rl/stepwise_curriculum_olmo2_13b.json
report_to: wandb

max_steps: 100
per_device_train_batch_size: 4
gradient_accumulation_steps: 6
gradient_checkpointing: true
gradient_checkpointing_kwargs:
  use_reentrant: false
learning_rate: 3.0e-6
lr_scheduler_type: cosine
warmup_ratio: 0.03
max_grad_norm: 1.0
seed: 42

loss_type: grpo
beta: 0.01
optim: adamw_torch_fused
max_prompt_length: 256
max_completion_length: 1024
num_generations: 16
mask_truncated_completions: false
use_vllm: true
vllm_gpu_memory_utilization: 0.50

logging_strategy: steps
logging_steps: 1
save_strategy: "steps"
save_steps: 50
save_total_limit: 4
resume_from_checkpoint: false
