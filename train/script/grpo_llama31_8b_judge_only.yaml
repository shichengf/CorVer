# Ablation: vanilla GRPO without the sentence-level CorVer signal — only the
# response-level judge + format rewards are used.
# Launch with: STEPWISE_REWARD_MODE=judge_only python main_stepwise.py --config ...
model_name_or_path: "meta-llama/Llama-3.1-8B-Instruct"
model_revision: main
torch_dtype: bfloat16
lora_r: 128
lora_alpha: 256
attn_implementation: flash_attention_2
bf16: true
tf32: true
output_dir: "output/llama31_8b_judge_only"
run_name: "llama31_8b_judge_only"

dataset_id_or_path: ../data/rl/stepwise_curriculum_llama31_8b.json
report_to: wandb

max_steps: 200
per_device_train_batch_size: 8
gradient_accumulation_steps: 3
gradient_checkpointing: true
gradient_checkpointing_kwargs:
  use_reentrant: false
learning_rate: 1.0e-5
lr_scheduler_type: cosine
warmup_ratio: 0.03
seed: 42

loss_type: grpo
beta: 0.001
optim: adamw_8bit
max_prompt_length: 256
max_completion_length: 512
num_generations: 16
mask_truncated_completions: false
use_vllm: true
vllm_gpu_memory_utilization: 0.4

logging_strategy: steps
logging_steps: 1
save_strategy: "steps"
save_steps: 25
save_total_limit: 8
resume_from_checkpoint: false
