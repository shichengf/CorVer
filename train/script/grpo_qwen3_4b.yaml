# Qwen3-4B: CorVer stepwise GRPO training config.
# Training data includes the self-filter learning-zone subset plus 1,000 anchor
# questions (n_correct = 16, always-correct) to preserve baseline competence.
model_name_or_path: "Qwen/Qwen3-4B"
torch_dtype: bfloat16
lora_r: 128
lora_alpha: 256
attn_implementation: flash_attention_2
bf16: true
tf32: true
output_dir: "output/qwen3_4b"
run_name: "qwen3_4b"

dataset_id_or_path: ../data/rl/stepwise_curriculum_qwen3_4b.json
report_to: wandb

max_steps: 100
per_device_train_batch_size: 8
gradient_accumulation_steps: 3
gradient_checkpointing: true
gradient_checkpointing_kwargs:
  use_reentrant: false
learning_rate: 1.0e-5
lr_scheduler_type: cosine
warmup_ratio: 0.03
max_grad_norm: 1.0
seed: 42

loss_type: grpo
beta: 0.001
optim: adamw_8bit
max_prompt_length: 256
max_completion_length: 1024
num_generations: 16
mask_truncated_completions: false
use_vllm: true
vllm_gpu_memory_utilization: 0.4

logging_strategy: steps
logging_steps: 1
save_strategy: "steps"
save_steps: 50
save_total_limit: 4
resume_from_checkpoint: false
